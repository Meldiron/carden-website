<!doctype html>
<!-- The share thumbnail (Open Graph and X cards), 1200 x 630. Rendered to public/og.png by
     scripts/render-og.sh. Same look as the site: white canvas, panes of lotus glass, the hero screen. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Rounded"; src: url("file:///System/Library/Fonts/SFNSRounded.ttf"); font-weight: 100 1000; }
* { box-sizing: border-box; }
html, body { margin: 0; }
.card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #fff;
  font-family: "Rounded", ui-rounded, system-ui, sans-serif; color: #111118; }
.pane { position: absolute; border-radius: 56px; opacity: .62; mix-blend-mode: multiply;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.6), inset 0 0 0 1.5px rgba(255,255,255,.35), 0 40px 80px -30px rgba(28,30,60,.25); }
.pane::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 38%); }
.pane::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, transparent 32%, rgba(255,255,255,.26) 44%, transparent 56%); }
.blue { background: linear-gradient(150deg, #8ccbff, #2f86f2); }
.pink { background: linear-gradient(150deg, #ff8fb5, #ff4f8b); }
.gold { background: linear-gradient(150deg, #ffd36a, #f0a30f); }
.brand { position: absolute; left: 80px; top: 76px; display: flex; align-items: center; gap: 18px; }
.brand img { width: 76px; height: 76px; border-radius: 22.37%; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.brand span { font-size: 46px; font-weight: 700; letter-spacing: -0.01em; }
h1 { position: absolute; left: 80px; top: 196px; width: 620px; margin: 0; font-size: 92px; line-height: 1.02; font-weight: 700; letter-spacing: -0.02em; }
p { position: absolute; left: 84px; top: 420px; width: 560px; margin: 0; font-size: 30px; line-height: 1.35; color: #5f5f6e; font-weight: 500; }
.phone { position: absolute; right: 70px; top: 46px; width: 330px; filter: drop-shadow(0 30px 40px rgba(28,30,60,.22)); }
</style></head><body>
<div class="card">
  <div class="pane blue" style="right:-60px; top:-60px; width:440px; height:560px; transform: rotate(12deg)"></div>
  <div class="pane pink" style="right:250px; top:250px; width:340px; height:420px; transform: rotate(-8deg)"></div>
  <div class="pane gold" style="left:-120px; bottom:-170px; width:380px; height:320px; transform: rotate(-14deg)"></div>
  <div class="brand"><img src="../../public/carden-icon.svg" alt=""><span>Carden</span></div>
  <h1>Your calm picture puzzle.</h1>
  <p>A new picture every day, on iPhone and in your browser.</p>
  <img class="phone" src="../../public/screens/hero.webp" alt="">
</div>
</body></html>
