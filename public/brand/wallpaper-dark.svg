<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Carden's Home Screen wallpaper, night: an original in the manner of iOS 26's glass wallpapers
       (large translucent forms with bright rims over a soft sky), drawn for this site. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1e"/><stop offset=".55" stop-color="#0d1640"/><stop offset="1" stop-color="#1d0f2e"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b7bff"/><stop offset="1" stop-color="#0c2a8f"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a63ff"/><stop offset="1" stop-color="#2c1a85"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#a3214f"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".45" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g filter="url(#glow)" opacity=".7">
    <ellipse cx="420" cy="760" rx="420" ry="260" fill="#1d3fae"/>
    <ellipse cx="1260" cy="240" rx="420" ry="240" fill="#4a2aa8"/>
    <ellipse cx="1220" cy="860" rx="360" ry="200" fill="#8a1f4f"/>
  </g>
  <g filter="url(#soft)">
    <g transform="rotate(-24 560 620)">
      <rect x="120" y="420" width="900" height="400" rx="200" fill="url(#blue)" opacity=".86" style="mix-blend-mode:screen"/>
      <rect x="120" y="420" width="900" height="400" rx="200" fill="url(#sheen)"/>
      <rect x="121.5" y="421.5" width="897" height="397" rx="198.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
    </g>
    <g transform="rotate(18 1100 380)">
      <rect x="700" y="210" width="820" height="340" rx="170" fill="url(#violet)" opacity=".84" style="mix-blend-mode:screen"/>
      <rect x="700" y="210" width="820" height="340" rx="170" fill="url(#sheen)"/>
      <rect x="701.5" y="211.5" width="817" height="337" rx="168.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
    </g>
    <g transform="rotate(-8 1150 760)">
      <rect x="860" y="640" width="640" height="250" rx="125" fill="url(#coral)" opacity=".82" style="mix-blend-mode:screen"/>
      <rect x="860" y="640" width="640" height="250" rx="125" fill="url(#sheen)"/>
      <rect x="861.5" y="641.5" width="637" height="247" rx="123.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
    </g>
  </g>
</svg>
